<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Budget</title>
  <link rel="stylesheet" href="setbudget.css">
</head>
<body>
  <div class="main-container">
    <div class="illustration">
      <img src="setBudget.png" alt="Illustration">
    </div>

    <div class="budget-section">
      <div class="budget-container">
        <h2>Monthly Budget</h2>
        <form id="budgetForm">
          <input type="number" id="budget" placeholder="Set your budget" required />
          <br><br>
          <button type="submit">Set Budget</button>
        </form>
      </div>
      <div class="quote">
        <h1>"Budgeting is not about limiting yourself-
          <br>it’s about making room for the things that matter most."</h1>
      </div>
    </div>
  </div>

  <div class="back-home">
    <a href="index.html">Back to Home</a>
  </div>

  <script src="setbudget.js"></script>
</body>
</html>
